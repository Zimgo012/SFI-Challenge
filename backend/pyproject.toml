[project]
name = "sfi-challenge-backend"
version = "0.1.0"
description = "FastAPI backend for SFI Challenge"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.10,<3.0",
    "uvicorn>=0.34,<1.0",
]

[dependency-groups]
dev = ["httpx>=0.28,<1.0"]

[tool.uv]
package = false
